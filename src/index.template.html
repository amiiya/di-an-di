      "description": "Im Di An Di erwartet dich authentisches vietnamesisches Essen mitten in Hamburg Uhlenhorst, nahe Barmbek-Süd. Genieße unsere vietnamesische Küche vor Ort oder zum Mitnehmen. Auf der Speisekarte stehen beliebte Klassiker wie Pho-Suppe, knusprige Frühlingsrollen, frische Sommerrollen, Reisnudelsalate, Nudelgerichte mit Fleisch, Fisch oder Tofu sowie aromatische Reisgerichte. Unsere Familienrezepte stammen aus Saigon und werden seit Generationen verfeinert. Ob Mittagessen, Abendessen oder Take-away – bei uns findest du frisch zubereitete asiatische Spezialitäten in gemütlicher Atmosphäre. Ideal für alle, die vietnamesisches und asiatisches Essen lieben.",
